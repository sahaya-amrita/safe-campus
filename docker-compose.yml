services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sahaya
      POSTGRES_USER: sahaya
      POSTGRES_PASSWORD: sahaya_local_only
    ports:
      - '${POSTGRES_PORT:-55432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sahaya -d sahaya']
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - sahaya-postgres:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro

volumes:
  sahaya-postgres:
