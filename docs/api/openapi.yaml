openapi: 3.1.0
info:
  title: Amrita Sahaya API
  version: 0.3.0
  description: >-
    Test-safe backend API for the SAFE CAMPUS hackathon MVP. All notification and dispatch
    behavior is simulated. No endpoint contacts real emergency services.
servers:
  - url: http://127.0.0.1:3000/api/v1
    description: Local development
tags:
  - name: Health
  - name: Authentication
  - name: Users
  - name: Incidents
  - name: Check-ins
  - name: Help requests
  - name: Instruction packs
  - name: Responders
  - name: Dispatches
  - name: Alerts
  - name: Trusted contacts
  - name: Drills
  - name: Training
  - name: Maps
  - name: Administration
  - name: SOS
  - name: Attachments
paths:
  /health:
    get:
      tags: [Health]
      security: []
      operationId: getHealth
      responses:
        '200':
          description: API and database are available
          content:
            application/json:
              schema:
                type: object
                required: [status, service, mode, database, timestamp]
                properties:
                  status: { const: ok }
                  service: { const: amrita-sahaya-api }
                  mode: { $ref: '#/components/schemas/OperatingMode' }
                  database: { const: connected }
                  latencyMs: { type: integer }
                  timestamp: { type: string, format: date-time }
  /auth/demo-login:
    post:
      tags: [Authentication]
      security: []
      operationId: demoLogin
      summary: Authenticate a fictional local account (development only)
      description: Exists only when DEMO_LOGIN_ENABLED=true outside production; otherwise 404.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
      responses:
        '200':
          description: Short-lived demo access token
          content:
            application/json:
              schema:
                type: object
                required: [accessToken, expiresInSeconds, user, warning]
                properties:
                  accessToken: { type: string }
                  expiresInSeconds: { type: integer, const: 7200 }
                  user: { $ref: '#/components/schemas/User' }
                  warning: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /auth/config:
    get:
      tags: [Authentication]
      security: []
      operationId: getAuthConfig
      summary: Sign-in methods, allowed registration domains and code limits
      responses:
        '200':
          description: Public sign-in configuration
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthConfig' }
  /auth/otp/request:
    post:
      tags: [Authentication]
      security: []
      operationId: requestSignInCode
      summary: Email a one-time sign-in code
      description: >-
        Always answers 202 with the same body, whether or not the address has an account or
        may register, so accounts cannot be discovered. A code is emailed only to active
        accounts or to new addresses on AUTH_ALLOWED_EMAIL_DOMAINS. A new request cancels
        older codes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email, maxLength: 254 }
      responses:
        '202':
          description: Request accepted
          content:
            application/json:
              schema:
                type: object
                required: [status, codeTtlSeconds, resendAfterSeconds]
                properties:
                  status: { const: CODE_SENT_IF_ELIGIBLE }
                  codeTtlSeconds: { type: integer }
                  resendAfterSeconds: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503':
          description: No email sender configured (EMAIL_DELIVERY_UNAVAILABLE) or sending failed (EMAIL_SEND_FAILED)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /auth/otp/verify:
    post:
      tags: [Authentication]
      security: []
      operationId: verifySignInCode
      summary: Exchange a one-time code for an access token
      description: >-
        Codes are single-use, expire after OTP_TTL_SECONDS and lock after OTP_MAX_ATTEMPTS
        wrong attempts. A first sign-in on an allowed domain creates a STUDENT account; staff
        roles are granted only by an ADMIN.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code]
              properties:
                email: { type: string, format: email }
                code: { type: string, pattern: '^[0-9]{6}$' }
                displayName: { type: string, minLength: 2, maxLength: 80 }
      responses:
        '200':
          description: Signed in to an existing account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SignInResult' }
        '201':
          description: Account created and signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SignInResult' }
        '400':
          description: Wrong, used or expired code (OTP_INVALID)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '403':
          description: Account disabled (ACCOUNT_DISABLED)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /incidents:
    get:
      tags: [Incidents]
      operationId: listIncidents
      summary: List own incidents or the authorized operational queue
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Paginated incident list
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Incident' } }
                  nextCursor: { type: [string, 'null'] }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Incidents]
      operationId: createIncident
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateIncident' }
      responses:
        '201':
          description: Incident accepted by the server; urgent priorities include a simulated dispatch
          content:
            application/json:
              schema:
                type: object
                required: [id, verificationStatus, priority, deliveryStatus, serverReceivedAt]
                properties:
                  id: { type: string, format: uuid }
                  verificationStatus: { const: REPORTED }
                  priority: { $ref: '#/components/schemas/IncidentPriority' }
                  deliveryStatus: { const: SERVER_RECEIVED }
                  serverReceivedAt: { type: string, format: date-time }
                  dispatch:
                    oneOf:
                      - type: 'null'
                      - type: object
                        properties:
                          id: { type: string, format: uuid }
                          status: { const: CREATED }
                          simulated: { const: true }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /users/me:
    get:
      tags: [Users]
      operationId: getAuthenticatedUser
      summary: Retrieve the authenticated profile and server-owned roles
      responses:
        '200':
          description: Authenticated user profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Users]
      operationId: updateAuthenticatedUser
      summary: Change your own display name or language (never roles)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                displayName: { type: string, minLength: 2, maxLength: 80 }
                language: { enum: [en, ta] }
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /users/me/sign-out-everywhere:
    post:
      tags: [Users]
      operationId: signOutEverywhere
      summary: Revoke every access token issued to this account so far
      responses:
        '204': { description: All sessions ended }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /incidents/{incidentId}:
    parameters: [{ $ref: '#/components/parameters/IncidentId' }]
    get:
      tags: [Incidents]
      operationId: getIncident
      summary: Retrieve an incident when permitted by ownership or role
      responses:
        '200': { description: Incident detail }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /incidents/{incidentId}/reports:
    parameters: [{ $ref: '#/components/parameters/IncidentId' }]
    post:
      tags: [Incidents]
      operationId: addIncidentReport
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [description]
              properties:
                description: { type: string, minLength: 3, maxLength: 2000 }
                zoneId: { type: string, format: uuid }
                observedAt: { type: string, format: date-time }
      responses:
        '201':
          description: Eyewitness report accepted without changing official verification
        '404': { $ref: '#/components/responses/NotFound' }
  /incidents/{incidentId}/reviews:
    parameters: [{ $ref: '#/components/parameters/IncidentId' }]
    post:
      tags: [Incidents]
      operationId: reviewIncident
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      summary: Apply an authorized verification transition
      description: Requires INCIDENT_VERIFIER or ADMIN. Report count never invokes this transition automatically.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status, reason]
              properties:
                status: { enum: [CORROBORATED, VERIFIED, RESOLVED, DISMISSED] }
                reason: { type: string, minLength: 5, maxLength: 1000 }
                evidenceIds: { type: array, maxItems: 20, items: { type: string, format: uuid } }
      responses:
        '201': { description: Append-only review record }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /incidents/{incidentId}/checkins/summary:
    parameters: [{ $ref: '#/components/parameters/IncidentId' }]
    get:
      tags: [Check-ins]
      operationId: getIncidentCheckinSummary
      summary: Get latest check-in counts including eligible students with no response
      responses:
        '200': { description: 'CONFIRMED_SAFE, HELP_REQUESTED, and UNCONFIRMED counts' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /checkins:
    post:
      tags: [Check-ins]
      operationId: submitCheckin
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubmitCheckin' }
      responses:
        '201':
          description: Server-received check-in; HELP_REQUESTED also returns a persistent OPEN helpRequest
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /checkins/me/latest:
    get:
      tags: [Check-ins]
      operationId: getLatestOwnCheckin
      parameters:
        - name: incidentId
          in: query
          schema: { type: string, format: uuid }
        - name: drillId
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Latest server-received state, or UNCONFIRMED when no state exists
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /checkins/help-requests:
    get:
      tags: [Check-ins]
      operationId: listHelpRequests
      responses:
        '200':
          description: Responders receive requests only for their verified assigned zone; verifiers and admins receive all
        '403': { $ref: '#/components/responses/Forbidden' }
      deprecated: true
  /help-requests:
    get:
      tags: [Help requests]
      operationId: listPersistentHelpRequests
      summary: List persistent help requests within the caller's operational scope
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/HelpRequestStatus' }
      responses:
        '200':
          description: Cursor-paginated help requests; responders are restricted to their verified assigned zone
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /help-requests/mine:
    get:
      tags: [Help requests]
      operationId: listMyHelpRequests
      summary: The authenticated student's own help requests and their server-recorded lifecycle
      description: Requires STUDENT. Responder identity is not exposed; only whether one is assigned.
      responses:
        '200': { description: "Up to 50 of the caller's help requests, newest first" }
        '403': { $ref: '#/components/responses/Forbidden' }
  /help-requests/{helpRequestId}/acknowledge:
    post:
      tags: [Help requests]
      operationId: acknowledgeHelpRequest
      parameters:
        - { $ref: '#/components/parameters/HelpRequestId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '200': { description: OPEN help request moved to ACKNOWLEDGED }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /help-requests/{helpRequestId}/assign:
    post:
      tags: [Help requests]
      operationId: assignHelpRequest
      parameters:
        - { $ref: '#/components/parameters/HelpRequestId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssignHelpRequest' }
      responses:
        '200':
          { description: Help request assigned to a verified on-duty responder in the same zone }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /help-requests/{helpRequestId}/resolve:
    post:
      tags: [Help requests]
      operationId: resolveHelpRequest
      parameters:
        - { $ref: '#/components/parameters/HelpRequestId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '200': { description: Assigned responder or administrator moved the request to RESOLVED }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /sos:
    post:
      tags: [SOS]
      operationId: sendSos
      summary: Ask for help when no drill or incident is open (STUDENT)
      description: >-
        Records an unverified SOS incident (hazard level L1), the student's help check-in and an
        OPEN help request, and matches up to three verified, available responders with a
        SIMULATED notification. The reply is a server receipt only: nobody has acknowledged or
        accepted the request, and nothing is published as an alert.
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clientActionId, clientCreatedAt]
              properties:
                clientActionId: { type: string, format: uuid }
                clientCreatedAt: { type: string, format: date-time }
                details: { type: string, minLength: 1, maxLength: 1000 }
                category: { $ref: '#/components/schemas/ReportCategory' }
                location: { $ref: '#/components/schemas/ReportLocation' }
                buildingId: { type: string, format: uuid }
                floorId:
                  { type: string, format: uuid, description: Required when buildingId is given }
      responses:
        '201':
          description: Received by the server (not acknowledged by anyone)
          content:
            application/json:
              schema:
                type: object
                required:
                  [
                    id,
                    status,
                    deliveryStatus,
                    serverReceivedAt,
                    clientActionId,
                    incidentId,
                    helpRequest,
                  ]
                properties:
                  id: { type: string, format: uuid }
                  status: { const: HELP_REQUESTED }
                  deliveryStatus: { const: SERVER_RECEIVED }
                  serverReceivedAt: { type: string, format: date-time }
                  clientActionId: { type: string, format: uuid }
                  incidentId: { type: string, format: uuid }
                  helpRequest:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      status: { const: OPEN }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /attachments:
    post:
      tags: [Attachments]
      operationId: uploadAttachment
      summary: Upload one photo (raw JPEG or PNG bytes, at most 5 MB)
      description: >-
        The type is read from the bytes, and metadata (EXIF, XMP, text chunks) is removed before
        storage. The same image uploaded twice by the same account returns the first record
        (200). An account may hold at most 20 unattached photos.
      requestBody:
        required: true
        content:
          image/jpeg: { schema: { type: string, format: binary } }
          image/png: { schema: { type: string, format: binary } }
      responses:
        '200':
          description: Already uploaded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Attachment' }
        '201':
          description: Stored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Attachment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { description: Larger than 5 MB }
        '415': { description: Not a JPEG or PNG }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /attachments/{attachmentId}/content:
    get:
      tags: [Attachments]
      operationId: getAttachmentContent
      summary: Photo bytes for the owner, or for staff once attached (every staff view is audited)
      description: >-
        RESPONDER-only accounts see help-request photos only for requests in their assigned zone,
        assigned to them, or notified to them. Responses are private and never cached.
      parameters:
        - { name: attachmentId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Image bytes
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /help-requests/{helpRequestId}/attachments:
    post:
      tags: [Attachments]
      operationId: attachHelpRequestPhotos
      summary: Attach the owner's uploaded photos to their help request (at most 3)
      parameters:
        - { name: helpRequestId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [attachmentIds]
              properties:
                attachmentIds:
                  type: array
                  maxItems: 3
                  uniqueItems: true
                  items: { type: string, format: uuid }
      responses:
        '200':
          description: Photos now attached
          content:
            application/json:
              schema:
                type: object
                required: [linked, attachments]
                properties:
                  linked: { type: array, items: { type: string, format: uuid } }
                  attachments: { type: array, items: { $ref: '#/components/schemas/Attachment' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /help-requests/{helpRequestId}/cancel:
    post:
      tags: [Help requests]
      operationId: cancelHelpRequest
      parameters:
        - { $ref: '#/components/parameters/HelpRequestId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '200': { description: Owning student or administrator moved the request to CANCELLED }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /responders/appropriate:
    get:
      tags: [Responders]
      operationId: listAppropriateResponders
      parameters:
        - name: zoneId
          in: query
          schema: { type: string, format: uuid }
        - name: qualification
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Verified available responders filtered by coarse assigned zone; no live GPS
        '400': { $ref: '#/components/responses/BadRequest' }
  /dispatches:
    get:
      tags: [Dispatches]
      operationId: listDispatches
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Admins receive all dispatches; responders receive unassigned and self-assigned dispatches
        '403': { $ref: '#/components/responses/Forbidden' }
  /dispatches/{dispatchId}/acknowledge:
    post:
      tags: [Dispatches]
      operationId: acknowledgeDispatch
      parameters:
        - name: dispatchId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '200':
          description: Dispatch moved to ACCEPTED and an unassigned dispatch is claimed by the verified responder
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /alerts:
    get:
      tags: [Alerts]
      operationId: listAlerts
      summary: Staff list of alerts with zone, recipient and acknowledgment counts
      description: Requires RESPONDER, INCIDENT_VERIFIER or ADMIN.
      responses:
        '200': { description: 'Up to 100 alerts, newest first' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Alerts]
      operationId: createAlert
      summary: Create a zone-scoped alert draft
      description: Requires ADMIN; all supported modes are non-live.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAlert' }
      responses:
        '201': { description: Alert draft }
        '403': { $ref: '#/components/responses/Forbidden' }
  /alerts/{alertId}/authorize:
    post:
      tags: [Alerts]
      operationId: authorizeAlert
      parameters:
        - name: alertId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '200': { description: Simulated recipient records and outbox event queued }
        '403': { $ref: '#/components/responses/Forbidden' }
  /alerts/inbox:
    get:
      tags: [Alerts]
      operationId: getAlertInbox
      responses:
        '200':
          description: >-
            Alerts targeted to the authenticated user, with alert status, linked incident id and
            that incident's verification status so clients never present a report as verified.
  /alerts/{alertId}/acknowledge:
    post:
      tags: [Alerts]
      operationId: acknowledgeAlert
      parameters:
        - name: alertId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '200': { description: Explicit recipient acknowledgment }
        '404': { $ref: '#/components/responses/NotFound' }
  /trusted-contacts:
    get:
      tags: [Trusted contacts]
      operationId: listTrustedContacts
      responses:
        '200': { description: Owner-scoped contacts without decrypted contact values }
    post:
      tags: [Trusted contacts]
      operationId: createTrustedContact
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTrustedContact' }
      responses:
        '201': { description: Pending-consent contact; external delivery remains disabled }
  /trusted-contacts/{contactId}:
    parameters:
      - name: contactId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [Trusted contacts]
      operationId: updateTrustedContact
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateTrustedContact' }
      responses:
        '200': { description: Consent/preferences updated for the owner }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Trusted contacts]
      operationId: deleteTrustedContact
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '204': { description: Contact removed }
        '404': { $ref: '#/components/responses/NotFound' }
  /drills:
    get:
      tags: [Drills]
      operationId: listDrills
      responses:
        '200': { description: Demonstration/test drill configurations }
    post:
      tags: [Drills]
      operationId: createDrill
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateDrill' }
      responses:
        '201': { description: Draft drill configuration }
        '403': { $ref: '#/components/responses/Forbidden' }
  /drills/preflight:
    get:
      tags: [Drills]
      operationId: getDrillPreflight
      summary: Checks the drill console runs before a start (staff only)
      responses:
        '200':
          {
            description: 'verifiedIncidentsOpen, activeDrills and canStart (false while a verified incident is open)',
          }
        '403': { $ref: '#/components/responses/Forbidden' }
  /drills/stop-all:
    post:
      tags: [Drills]
      operationId: stopAllDrills
      summary: Kill switch. Any staff member can stop every ACTIVE drill (audited)
      responses:
        '200': { description: 'Number and ids of drills stopped' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /drills/{drillId}/start:
    post:
      tags: [Drills]
      operationId: startDrill
      summary: Start a DRAFT or AUTHORIZED drill (drill manager or admin)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: drillId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Drill now ACTIVE with startedAt }
        '409':
          {
            description: 'Drill not startable, or LIVE_INCIDENT_ACTIVE while a verified incident is open',
          }
  /drills/{drillId}/stop:
    post:
      tags: [Drills]
      operationId: stopDrill
      summary: Stop an ACTIVE drill (any staff; idempotent)
      parameters:
        - name: drillId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Drill COMPLETED with stoppedAt and stopReason }
        '404': { $ref: '#/components/responses/NotFound' }
  /drills/{drillId}/metrics:
    get:
      tags: [Drills]
      operationId: getDrillMetrics
      parameters:
        - name: drillId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          { description: Aggregated check-in and training metrics with synthetic-assumption label }
  /training/results:
    post:
      tags: [Training]
      operationId: saveTrainingResult
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TrainingResult' }
      responses:
        '201': { description: Training result persisted }
  /training/results/mine:
    get:
      tags: [Training]
      operationId: listMyTrainingResults
      responses:
        '200': { description: "Up to 50 of the caller's training results, newest first" }
  /instruction-packs:
    get:
      tags: [Instruction packs]
      operationId: listPublishedInstructionPacks
      summary: List only published and unexpired reviewed instruction packs
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
        - name: language
          in: query
          schema: { enum: [en, ta] }
      responses:
        '200': { description: Cursor-paginated published instruction packs }
        '400': { $ref: '#/components/responses/BadRequest' }
    post:
      tags: [Instruction packs]
      operationId: createInstructionPack
      summary: Create reviewable instruction metadata and caller-supplied content
      description: Requires INCIDENT_VERIFIER or ADMIN. The API never generates instruction content.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateInstructionPack' }
      responses:
        '201': { description: Draft instruction pack created }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /instruction-packs/review-queue:
    get:
      tags: [Instruction packs]
      operationId: listInstructionPackReviewQueue
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { description: Review metadata for INCIDENT_VERIFIER and ADMIN roles }
        '403': { $ref: '#/components/responses/Forbidden' }
  /instruction-packs/{instructionPackId}:
    get:
      tags: [Instruction packs]
      operationId: getInstructionPack
      parameters: [{ $ref: '#/components/parameters/InstructionPackId' }]
      responses:
        '200': { description: 'Published pack, or any pack for an authorized reviewer' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /instruction-packs/{instructionPackId}/review:
    post:
      tags: [Instruction packs]
      operationId: reviewInstructionPack
      parameters:
        - { $ref: '#/components/parameters/InstructionPackId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewInstructionPack' }
      responses:
        '200': { description: Pack moved to APPROVED or REJECTED with review metadata }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /instruction-packs/{instructionPackId}/publish:
    post:
      tags: [Instruction packs]
      operationId: publishInstructionPack
      description: Requires ADMIN and an APPROVED pack. No notifications are sent.
      parameters:
        - { $ref: '#/components/parameters/InstructionPackId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '200': { description: Approved pack moved to PUBLISHED }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /maps/buildings:
    get:
      tags: [Maps]
      operationId: listBuildings
      summary: Buildings with their geometry approval state (for location pickers and the map)
      responses:
        '200': { description: Up to 200 buildings }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /maps/blocks:
    get:
      tags: [Maps]
      operationId: listRouteBlocks
      summary: Active responder-marked blocked areas (routing avoids them)
      responses:
        '200': { description: 'Blocks with longitude, latitude, radiusM, reason, mode, createdAt' }
    post:
      tags: [Maps]
      operationId: createRouteBlock
      summary: Mark an area impassable (responder or admin; audited)
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [longitude, latitude, radiusM, reason]
              properties:
                longitude: { type: number, minimum: 76.88, maximum: 76.92 }
                latitude: { type: number, minimum: 10.88, maximum: 10.93 }
                radiusM: { type: integer, minimum: 5, maximum: 200 }
                reason: { type: string, minLength: 3, maxLength: 200 }
      responses:
        '201': { description: Block created }
        '400': { description: Invalid body or location outside the campus bounds }
        '403': { $ref: '#/components/responses/Forbidden' }
  /maps/blocks/{blockId}/clear:
    post:
      tags: [Maps]
      operationId: clearRouteBlock
      summary: Clear a block (responder or admin; idempotent; audited)
      parameters:
        - name: blockId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Block with clearedAt set }
        '404': { $ref: '#/components/responses/NotFound' }
  /maps/{buildingId}/approved:
    get:
      tags: [Maps]
      operationId: getBuildingMapMetadata
      parameters:
        - name: buildingId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Versioned building/floor/zone metadata and explicit approval flags }
        '404': { $ref: '#/components/responses/NotFound' }
  /assistant/health:
    get:
      tags: [Assistant]
      security: []
      operationId: getAssistantHealth
      summary: Secret-free status of Tom's AI provider
      responses:
        '200':
          description: Provider, configured model id and whether it was verified against the provider's model list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssistantHealth' }
  /assistant/interpret:
    post:
      tags: [Assistant]
      operationId: interpretAssistantQuestion
      summary: Ask Tom a question about using SAFE CAMPUS
      description: >-
        Roles come only from the access token. Emergencies and requests to perform actions are answered by
        fixed rules and never sent to a model. Suggested actions are never executed by the server. Provider
        failures return a deterministic answer with origin.source FALLBACK (HTTP 200), or type unavailable.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssistantInterpretRequest' }
      responses:
        '200':
          description: Validated answer; see origin for AI vs rules vs fallback
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssistantInterpretResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413':
          description: Request body larger than 8192 bytes
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
        '429':
          description: Per-user assistant rate limit reached (Retry-After header set)
          headers:
            Retry-After: { schema: { type: integer } }
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
  /admin/users:
    get:
      tags: [Administration]
      operationId: adminListUsers
      summary: Search accounts (ADMIN)
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 120 } }
        - { name: role, in: query, schema: { $ref: '#/components/schemas/Role' } }
        - { name: status, in: query, schema: { enum: [ACTIVE, DISABLED] } }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Paginated accounts
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/AdminUser' } }
                  nextCursor: { type: [string, 'null'] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/users/{userId}/roles:
    post:
      tags: [Administration]
      operationId: adminGrantRole
      summary: Grant a role (ADMIN, audited, reason required)
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role, reason]
              properties:
                role: { $ref: '#/components/schemas/Role' }
                reason: { type: string, minLength: 5, maxLength: 300 }
      responses:
        '200': { $ref: '#/components/responses/RoleChange' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/users/{userId}/roles/{role}/revoke:
    post:
      tags: [Administration]
      operationId: adminRevokeRole
      summary: Remove a role (ADMIN, audited); never your own ADMIN role or the last active ADMIN
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: role, in: path, required: true, schema: { $ref: '#/components/schemas/Role' } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 5, maxLength: 300 }
      responses:
        '200': { $ref: '#/components/responses/RoleChange' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/users/{userId}/status:
    post:
      tags: [Administration]
      operationId: adminSetUserStatus
      summary: Disable or enable an account (ADMIN, audited); disabling ends its sessions
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status, reason]
              properties:
                status: { enum: [ACTIVE, DISABLED] }
                reason: { type: string, minLength: 5, maxLength: 300 }
      responses:
        '200':
          description: Result
          content:
            application/json:
              schema:
                type: object
                required: [changed, status]
                properties:
                  changed: { type: boolean }
                  status: { enum: [ACTIVE, DISABLED] }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/audit-events:
    get:
      tags: [Administration]
      operationId: adminListAuditEvents
      summary: Read audit events, newest first (ADMIN, read-only)
      parameters:
        - { name: action, in: query, schema: { type: string, maxLength: 80 } }
        - { name: entityType, in: query, schema: { type: string, maxLength: 80 } }
        - { name: actorId, in: query, schema: { type: string, format: uuid } }
        - { name: before, in: query, schema: { type: integer, minimum: 1 } }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100, default: 50 },
          }
      responses:
        '200':
          description: Audit events
          content:
            application/json:
              schema:
                type: object
                required: [items, nextBefore]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/AuditEvent' } }
                  nextBefore: { type: [integer, 'null'] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 200 }
    IncidentId:
      name: incidentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    HelpRequestId:
      name: helpRequestId
      in: path
      required: true
      schema: { type: string, format: uuid }
    InstructionPackId:
      name: instructionPackId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Cursor:
      name: cursor
      in: query
      schema: { type: string, maxLength: 500 }
      description: Opaque cursor returned as nextCursor by the preceding page
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
  responses:
    TooManyRequests:
      description: Rate limited (OTP_RESEND_TOO_SOON includes details.retryAfterSeconds)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    RoleChange:
      description: Roles after the change
      content:
        application/json:
          schema:
            type: object
            required: [changed, roles]
            properties:
              changed: { type: boolean }
              roles: { type: array, items: { $ref: '#/components/schemas/Role' } }
    BadRequest:
      description: Validation or state transition failed
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
    Unauthorized:
      description: Missing, invalid, or expired authentication
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
    Forbidden:
      description: Authenticated role is not authorized
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
    NotFound:
      description: Resource not found or not visible
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
    Conflict:
      description: Idempotency key was reused with a different request
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
  schemas:
    OperatingMode: { enum: [DEMO, DRILL, TEST, SIMULATION] }
    Role: { enum: [STUDENT, RESPONDER, INCIDENT_VERIFIER, DRILL_MANAGER, ADMIN] }
    VerificationStatus: { enum: [REPORTED, CORROBORATED, VERIFIED, RESOLVED, DISMISSED] }
    IncidentPriority: { enum: [LOW, MEDIUM, HIGH, CRITICAL] }
    DeliveryStatus: { enum: [LOCAL_ONLY, QUEUED, SENDING, SERVER_RECEIVED, ACKNOWLEDGED, FAILED] }
    HelpRequestStatus: { enum: [OPEN, ACKNOWLEDGED, ASSIGNED, RESOLVED, CANCELLED] }
    InstructionPackApprovalState: { enum: [DRAFT, APPROVED, REJECTED, PUBLISHED, RETIRED] }
    AssistantAction:
      oneOf:
        - type: object
          additionalProperties: false
          required: [type, destinationId]
          properties: { type: { const: NAVIGATE }, destinationId: { type: string, maxLength: 64 } }
        - type: object
          additionalProperties: false
          required: [type, tourId]
          properties:
            { type: { const: START_GUIDED_TOUR }, tourId: { type: string, maxLength: 64 } }
        - type: object
          additionalProperties: false
          required: [type, instructionPackId]
          properties:
            {
              type: { const: OPEN_APPROVED_INSTRUCTIONS },
              instructionPackId: { type: string, maxLength: 64 },
            }
    AssistantInterpretRequest:
      type: object
      additionalProperties: false
      required: [question, context]
      properties:
        question: { type: string, minLength: 1, maxLength: 500 }
        context:
          type: object
          additionalProperties: false
          required: [screen]
          properties:
            screen: { type: string, maxLength: 64, pattern: '^[a-z][a-z0-9-]*(\.[a-z0-9-]+){0,3}$' }
            locale: { enum: [en, ta], default: en }
        history:
          type: array
          maxItems: 6
          items:
            type: object
            additionalProperties: false
            required: [role, content]
            properties:
              role: { enum: [user, assistant] }
              content: { type: string, minLength: 1, maxLength: 600 }
    AssistantInterpretResponse:
      type: object
      additionalProperties: false
      required: [type, answer, action, references, origin, generatedAt]
      properties:
        type:
          {
            enum:
              [
                answer,
                clarification,
                navigation_suggestion,
                guided_tour,
                safety_redirect,
                unsupported,
                unavailable,
              ],
          }
        answer: { type: string, maxLength: 1200 }
        action:
          oneOf:
            - { $ref: '#/components/schemas/AssistantAction' }
            - { type: 'null' }
        references:
          type: array
          maxItems: 5
          items:
            type: object
            additionalProperties: false
            required: [id, kind, title, version, source, reviewState]
            properties:
              id: { type: string }
              kind:
                {
                  enum:
                    [
                      SCREEN_GUIDE,
                      STATUS_GLOSSARY,
                      WORKFLOW,
                      TOUR,
                      CAMPUS_CONTACT,
                      INSTRUCTION_PACK,
                    ],
                }
              title: { type: string }
              version: { type: string }
              source: { type: string }
              reviewState: { enum: [APPROVED, DRAFT] }
        origin:
          type: object
          additionalProperties: false
          required: [source, provider, model, fallbackReason]
          properties:
            source: { enum: [AI, RULES, FALLBACK] }
            provider: { enum: [groq, mock, rules] }
            model: { type: [string, 'null'] }
            fallbackReason:
              enum:
                [
                  PROVIDER_DISABLED,
                  PROVIDER_UNCONFIGURED,
                  MODEL_UNAVAILABLE,
                  TIMEOUT,
                  RATE_LIMITED,
                  REFUSED,
                  TRUNCATED,
                  INVALID_OUTPUT,
                  UNAVAILABLE,
                  null,
                ]
        generatedAt: { type: string, format: date-time }
    AssistantHealth:
      type: object
      additionalProperties: false
      required: [status, provider, model, modelCheck]
      properties:
        status: { enum: [ready, degraded, disabled] }
        provider: { enum: [groq, mock, disabled] }
        model: { type: [string, 'null'] }
        modelCheck: { enum: [ok, not_listed, unchecked, error] }
    AuthConfig:
      type: object
      required:
        [
          methods,
          allowedEmailDomains,
          emailDelivery,
          codeLength,
          codeTtlSeconds,
          resendAfterSeconds,
        ]
      properties:
        methods: { type: array, items: { enum: [EMAIL_OTP, DEMO_PASSWORD] } }
        allowedEmailDomains: { type: array, items: { type: string } }
        emailDelivery: { type: boolean }
        codeLength: { type: integer }
        codeTtlSeconds: { type: integer }
        resendAfterSeconds: { type: integer }
    SignInResult:
      type: object
      required: [accessToken, expiresInSeconds, user, warning, created]
      properties:
        accessToken: { type: string }
        expiresInSeconds: { type: integer }
        user: { $ref: '#/components/schemas/User' }
        warning: { type: string }
        created: { type: boolean }
    AdminUser:
      type: object
      required: [id, email, displayName, roles, status, emailVerifiedAt, lastSignInAt, createdAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        displayName: { type: string }
        roles: { type: array, items: { $ref: '#/components/schemas/Role' } }
        status: { enum: [ACTIVE, DISABLED] }
        emailVerifiedAt: { type: [string, 'null'], format: date-time }
        lastSignInAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
    AuditEvent:
      type: object
      required: [id, actorId, actorEmail, action, entityType, entityId, metadata, createdAt]
      properties:
        id: { type: integer }
        actorId: { type: [string, 'null'], format: uuid }
        actorEmail: { type: [string, 'null'] }
        action: { type: string }
        entityType: { type: string }
        entityId: { type: [string, 'null'] }
        metadata: { type: object }
        createdAt: { type: string, format: date-time }
    User:
      type: object
      required: [id, email, displayName, language, roles, mode]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        displayName: { type: string }
        language: { enum: [en, ta] }
        roles: { type: array, items: { $ref: '#/components/schemas/Role' } }
        mode: { $ref: '#/components/schemas/OperatingMode' }
    Incident:
      type: object
      properties:
        id: { type: string, format: uuid }
        type: { type: string }
        description: { type: string }
        priority: { $ref: '#/components/schemas/IncidentPriority' }
        verificationStatus: { $ref: '#/components/schemas/VerificationStatus' }
        mode: { $ref: '#/components/schemas/OperatingMode' }
        serverReceivedAt: { type: string, format: date-time }
    CreateIncident:
      type: object
      additionalProperties: false
      required: [type, description, priority]
      properties:
        type: { type: string, minLength: 2, maxLength: 80 }
        description: { type: string, minLength: 3, maxLength: 2000 }
        priority: { $ref: '#/components/schemas/IncidentPriority' }
        buildingId: { type: string, format: uuid }
        floorId: { type: string, format: uuid }
        zoneId: { type: string, format: uuid }
        occurredAt: { type: string, format: date-time }
        category: { $ref: '#/components/schemas/ReportCategory' }
        kind:
          enum: [EMERGENCY, CONCERN]
          default: EMERGENCY
          description: CONCERN never starts a (simulated) dispatch.
        location: { $ref: '#/components/schemas/ReportLocation' }
        attachmentIds:
          type: array
          maxItems: 3
          uniqueItems: true
          items: { type: string, format: uuid }
          description: Photos uploaded by the reporter via POST /attachments.
        evidence:
          type: array
          maxItems: 4
          items:
            type: object
            required: [objectKey, mediaType, sizeBytes, sha256]
            properties:
              objectKey:
                { type: string, description: 'Private object-store key, never a public URL' }
              mediaType: { enum: [image/jpeg, image/png, video/mp4] }
              sizeBytes: { type: integer, minimum: 1, maximum: 10000000 }
              sha256: { type: string, pattern: '^[a-fA-F0-9]{64}$' }
    SubmitCheckin:
      type: object
      additionalProperties: false
      required: [status, clientCreatedAt, clientActionId]
      properties:
        incidentId: { type: string, format: uuid }
        drillId: { type: string, format: uuid }
        status: { enum: [CONFIRMED_SAFE, HELP_REQUESTED] }
        helpDetails: { type: string, minLength: 3, maxLength: 1000 }
        location: { $ref: '#/components/schemas/ReportLocation' }
        clientCreatedAt: { type: string, format: date-time }
        clientActionId: { type: string, format: uuid }
      description: >-
        Exactly one of incidentId/drillId. helpDetails is optional since 0.3.0; a help request
        without text is recorded as "No details given (quick help request)".
    ReportCategory: { enum: [FIRE_SMOKE, MEDICAL, PERSONAL_SAFETY, HAZARD, OTHER] }
    ReportLocation:
      type: object
      required: [method]
      description: >-
        Where the reporter said they were. GPS needs latitude, longitude, accuracyM and
        capturedAt; MANUAL needs a landmark. Never a verified position.
      properties:
        method: { enum: [GPS, MANUAL, NONE] }
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
        accuracyM: { type: number, minimum: 0 }
        capturedAt: { type: string, format: date-time }
        landmark: { type: string, minLength: 2, maxLength: 200 }
    Attachment:
      type: object
      required: [id, mediaType, sizeBytes, sha256, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        mediaType: { enum: [image/jpeg, image/png] }
        sizeBytes: { type: integer, maximum: 5000000 }
        sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        status: { enum: [STORED, ATTACHED] }
        createdAt: { type: string, format: date-time }
    AssignHelpRequest:
      type: object
      additionalProperties: false
      properties:
        responderId:
          type: string
          format: uuid
          description: Required for administrator assignment; responders may assign only themselves.
    HelpRequest:
      type: object
      required: [id, studentId, status, priority, details, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        studentId: { type: string, format: uuid }
        incidentId: { type: [string, 'null'], format: uuid }
        drillId: { type: [string, 'null'], format: uuid }
        zoneId: { type: [string, 'null'], format: uuid }
        status: { $ref: '#/components/schemas/HelpRequestStatus' }
        priority: { $ref: '#/components/schemas/IncidentPriority' }
        details: { type: string }
        assignedResponderId: { type: [string, 'null'], format: uuid }
        acknowledgedAt: { type: [string, 'null'], format: date-time }
        assignedAt: { type: [string, 'null'], format: date-time }
        resolvedAt: { type: [string, 'null'], format: date-time }
        cancelledAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CreateInstructionPack:
      type: object
      additionalProperties: false
      required: [version, language, title, content, contentHash, sourceLabel]
      properties:
        version: { type: string, minLength: 1, maxLength: 80 }
        language: { enum: [en, ta] }
        title: { type: string, minLength: 3, maxLength: 200 }
        content:
          type: object
          additionalProperties: true
          description: Caller-supplied reviewed content; never generated by the API.
        contentHash: { type: string, pattern: '^[a-fA-F0-9]{64}$' }
        sourceLabel: { type: string, minLength: 3, maxLength: 200 }
        sourceReference: { type: string, maxLength: 500 }
        expiresAt: { type: string, format: date-time }
    ReviewInstructionPack:
      type: object
      additionalProperties: false
      required: [decision, notes]
      properties:
        decision: { enum: [APPROVE, REJECT] }
        notes: { type: string, minLength: 3, maxLength: 2000 }
    InstructionPack:
      type: object
      properties:
        id: { type: string, format: uuid }
        version: { type: string }
        language: { enum: [en, ta] }
        title: { type: string }
        content: { type: object, additionalProperties: true }
        contentHash: { type: string }
        sourceLabel: { type: string }
        sourceReference: { type: [string, 'null'] }
        approvalState: { $ref: '#/components/schemas/InstructionPackApprovalState' }
        reviewNotes: { type: [string, 'null'] }
        approvedAt: { type: [string, 'null'], format: date-time }
        publishedAt: { type: [string, 'null'], format: date-time }
        expiresAt: { type: [string, 'null'], format: date-time }
        mode: { $ref: '#/components/schemas/OperatingMode' }
    CreateAlert:
      type: object
      required: [zoneIds, title, message, precautionary, mode]
      properties:
        incidentId: { type: string, format: uuid }
        zoneIds: { type: array, minItems: 1, maxItems: 100, items: { type: string, format: uuid } }
        title: { type: string, minLength: 3, maxLength: 140 }
        message: { type: string, minLength: 3, maxLength: 2000 }
        precautionary: { type: boolean }
        mode: { $ref: '#/components/schemas/OperatingMode' }
    CreateTrustedContact:
      type: object
      required: [name, contactChannel, contactValue, notificationPreferences]
      properties:
        name: { type: string }
        contactChannel: { enum: [EMAIL, PHONE] }
        contactValue: { type: string }
        notificationPreferences:
          type: object
          properties:
            incidentUpdates: { type: boolean }
            helpRequests: { type: boolean }
    UpdateTrustedContact:
      type: object
      properties:
        consentStatus: { enum: [PENDING, VERIFIED, REVOKED] }
        notificationPreferences:
          type: object
          required: [incidentUpdates, helpRequests]
          properties:
            incidentUpdates: { type: boolean }
            helpRequests: { type: boolean }
    CreateDrill:
      type: object
      required: [name, buildingId, scenarioRef, scenarioVersion, mode]
      properties:
        name: { type: string }
        buildingId: { type: string, format: uuid }
        scenarioRef: { type: string }
        scenarioVersion: { type: string }
        mode: { enum: [DRILL, TEST, SIMULATION] }
        assumptions: { type: object, additionalProperties: true }
    TrainingResult:
      type: object
      required: [scenarioRef, scenarioVersion, score, answers]
      properties:
        drillId: { type: string, format: uuid }
        scenarioRef: { type: string, minLength: 1, maxLength: 200 }
        scenarioVersion: { type: string, minLength: 1, maxLength: 40 }
        score: { type: number, minimum: 0, maximum: 100 }
        answers: { type: object, additionalProperties: true }
    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code: { type: string }
            message: { type: string }
            requestId: { type: string }
            details: {}
security:
  - bearerAuth: []
