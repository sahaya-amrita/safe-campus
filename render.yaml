# Render Blueprint for the Amrita Sahaya DEMO deployment: API (+ Tom assistant,
# simulated outbox worker) and the unified web app (student PWA, responder
# workspace, digital twin). Everything runs in DEMO mode with fictional data.
# See README.md and services/api/src/assistant/README.md.
#
# Secrets (GROQ_API_KEY) are entered in Render's dashboard when the Blueprint is
# created (sync: false) and are never committed. The static site receives only
# the API's public URL.
services:
  - type: web
    name: safe-campus-api
    runtime: node
    plan: free
    buildCommand: npx -y pnpm@11.25.0 install --frozen-lockfile --prod=false && npx -y pnpm@11.25.0 --filter @sahaya/contracts --filter @sahaya/api build
    # Migrations and the fictional DEMO seed are idempotent, so they run on every start.
    startCommand: node services/api/dist/scripts/migrate.js && node services/api/dist/scripts/seed.js && node services/api/dist/server.js
    healthCheckPath: /api/v1/assistant/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: '22'
      - key: DATABASE_URL
        fromDatabase:
          name: safe-campus-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: OPERATING_MODE
        value: DEMO
      # Render runs one proxy in front of the service (for sign-in rate limits).
      - key: TRUST_PROXY
        value: '1'
      # Sign-in by email code. DEMO password login is refused in production unless
      # OPERATING_MODE=DEMO (this hosted prototype opts in below).
      # Set EMAIL_PROVIDER=resend with RESEND_API_KEY and EMAIL_FROM, or leave it
      # unset and the app reports that codes cannot be emailed.
      # Hosted prototype: fictional seeded DEMO accounts sign in with passwords.
      - key: DEMO_LOGIN_ENABLED
        value: 'true'
      - key: AUTH_ALLOWED_EMAIL_DOMAINS
        sync: false
      - key: EMAIL_PROVIDER
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: LOG_LEVEL
        value: info
      # Full public URL: a fromService "host" gives the internal name only.
      - key: CORS_ALLOWED_ORIGINS
        value: https://safe-campus-web.onrender.com
      # Set in the dashboard: groq (with GROQ_API_KEY and GROQ_MODEL) or disabled.
      - key: ASSISTANT_PROVIDER
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        sync: false
      # Prototype: Tom may use its DRAFT app help (labelled "draft, not yet
      # reviewed" in answers). Honoured only with OPERATING_MODE=DEMO.
      - key: ASSISTANT_ALLOW_DRAFT_CONTENT
        value: 'true'
      - key: OUTBOX_POLL_MS
        value: '5000'
      - key: ASSISTANT_TIMEOUT_MS
        value: '12000'
      - key: ASSISTANT_PROVIDER_MAX_PER_MINUTE
        value: '25'
      - key: ASSISTANT_PROVIDER_MAX_PER_DAY
        value: '900'

  - type: web
    name: safe-campus-web
    runtime: static
    buildCommand: npx -y pnpm@11.25.0 install --frozen-lockfile --prod=false && npx -y pnpm@11.25.0 --filter @sahaya/web build
    staticPublishPath: apps/web/dist
    envVars:
      # Full public URL baked into the build (fromService "host" is internal-only).
      - key: VITE_API_BASE_URL
        value: https://safe-campus-api.onrender.com

databases:
  - name: safe-campus-db
    plan: free
    databaseName: sahaya
    user: sahaya
